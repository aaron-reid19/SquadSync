name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests when available
        run: |
          for package in \
            . \
            app/nextjs-ui \
            app/microservices/auth-service \
            app/microservices/api-gateway \
            app/microservices/identity-service \
            app/microservices/squad-service \
            app/microservices/event-service \
            app/microservices/chat-service \
            app/microservices/notification-worker; do
            echo "Running tests for ${package} when configured"
            pnpm --dir "${package}" run --if-present test
          done

      - name: Type-check packages
        run: pnpm run typecheck

      - name: Build UI
        run: pnpm run build

      - name: Build UI image
        run: docker build -f app/nextjs-ui/Dockerfile -t squadsync-nextjs-ui:ci .

      - name: Build auth image
        run: docker build -f app/microservices/auth-service/Dockerfile -t squadsync-auth-service:ci .

      - name: Build API gateway image
        run: docker build -f app/microservices/api-gateway/Dockerfile -t squadsync-api-gateway:ci .

      - name: Build scaffold service images
        run: |
          docker build -f app/microservices/identity-service/Dockerfile -t squadsync-identity-service:ci .
          docker build -f app/microservices/squad-service/Dockerfile -t squadsync-squad-service:ci .
          docker build -f app/microservices/event-service/Dockerfile -t squadsync-event-service:ci .
          docker build -f app/microservices/chat-service/Dockerfile -t squadsync-chat-service:ci .
          docker build -f app/microservices/notification-worker/Dockerfile -t squadsync-notification-worker:ci .

      - name: Build PostgreSQL migration image
        run: docker build -f database/postgres/migrations/Dockerfile -t squadsync-postgres-migrations:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: nextjs-ui
            dockerfile: app/nextjs-ui/Dockerfile
          - name: auth-service
            dockerfile: app/microservices/auth-service/Dockerfile
          - name: api-gateway
            dockerfile: app/microservices/api-gateway/Dockerfile
          - name: identity-service
            dockerfile: app/microservices/identity-service/Dockerfile
          - name: squad-service
            dockerfile: app/microservices/squad-service/Dockerfile
          - name: event-service
            dockerfile: app/microservices/event-service/Dockerfile
          - name: chat-service
            dockerfile: app/microservices/chat-service/Dockerfile
          - name: notification-worker
            dockerfile: app/microservices/notification-worker/Dockerfile
          - name: postgres-migrations
            dockerfile: database/postgres/migrations/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  promote-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin QA images to this commit
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E "s/newTag: .*/newTag: ${IMAGE_TAG}/" \
            k8s/overlays/aaron-reid-server/kustomization.yaml

      - name: Commit QA deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- k8s/overlays/aaron-reid-server/kustomization.yaml; then
            echo "QA is already pinned to this image tag"
            exit 0
          fi

          git add k8s/overlays/aaron-reid-server/kustomization.yaml
          git commit -m "chore(deploy): promote ${GITHUB_SHA} to QA [skip ci]"
          git push origin HEAD:main
          