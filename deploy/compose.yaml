services:
  auth-service:
    build:
      context: ..
      dockerfile: app/microservices/auth-service/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ..
      dockerfile: app/microservices/api-gateway/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs-ui:
    build:
      context: ..
      dockerfile: app/nextjs-ui/Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api-gateway:4000
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
