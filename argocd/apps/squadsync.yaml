apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squadsync
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aaron-reid19/SquadSync.git
    targetRevision: main
    path: k8s/overlays/aaron-reid-server
  destination:
    server: https://kubernetes.default.svc
    namespace: squadsync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
