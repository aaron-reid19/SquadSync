apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: auth-db-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: pg-main
  name: auth_app
  login: true
  passwordSecret:
    name: auth-db-app

