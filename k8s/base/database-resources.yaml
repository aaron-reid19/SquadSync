---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: auth-db
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: auth_db
  owner: auth_app
  cluster:
    name: pg-main
  extensions:
    - name: pgcrypto
      ensure: present

