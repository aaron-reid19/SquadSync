apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextjs-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextjs-ui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextjs-ui
          image: ghcr.io/aaron-reid19/squadsync/nextjs-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: squadsync-config
          env:
            - name: API_INTERNAL_URL
              value: http://api-gateway:4000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

